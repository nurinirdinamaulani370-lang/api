<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Data Users</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #fdf3f5 0%, #f3e6ea 100%);
        margin: 0;
        padding: 40px;
        color: #2d1a20;
    }

    .container {
        max-width: 1200px;
        margin: auto;
    }

    /* ===== TOP BAR ===== */

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        flex-wrap: wrap;
        gap: 12px;
    }

    .top-bar h1 {
        margin: 0;
        color: #5c0017;
        font-size: 28px;
        letter-spacing: 0.5px;
    }

    .top-bar .subtitle {
        color: #8a5a66;
        font-size: 14px;
        margin-top: 4px;
    }

    .btn-nav {
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: linear-gradient(135deg, #a8324f, #800020);
        color: white;
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 14px;
        box-shadow: 0 4px 12px rgba(128,0,32,0.25);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-nav:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(128,0,32,0.3);
    }

    /* ===== STAT CARDS ===== */

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-bottom: 30px;
    }

    .stat-card {
        background: white;
        border-radius: 16px;
        padding: 22px 24px;
        box-shadow: 0 8px 25px rgba(128,0,32,0.10);
        border-left: 5px solid #800020;
        position: relative;
        overflow: hidden;
    }

    .stat-card .icon {
        font-size: 26px;
        margin-bottom: 8px;
        display: block;
    }

    .stat-card .value {
        font-size: 32px;
        font-weight: 800;
        color: #5c0017;
        line-height: 1.1;
    }

    .stat-card .label {
        font-size: 13px;
        color: #8a5a66;
        margin-top: 6px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    /* ===== PANELS ===== */

    .panels {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 20px;
    }

    @media (max-width: 900px) {
        .panels {
            grid-template-columns: 1fr;
        }
    }

    .panel {
        background: white;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 25px rgba(128,0,32,0.08);
    }

    .panel h2 {
        margin: 0 0 18px 0;
        font-size: 17px;
        color: #5c0017;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* Bar chart sebaran alamat */

    .bar-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
    }

    .bar-label {
        width: 130px;
        font-size: 13px;
        color: #5c0017;
        font-weight: 600;
        flex-shrink: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .bar-track {
        flex: 1;
        background: #f5e6ea;
        border-radius: 20px;
        height: 14px;
        overflow: hidden;
    }

    .bar-fill {
        height: 100%;
        border-radius: 20px;
        background: linear-gradient(90deg, #c04060, #800020);
        transition: width 0.6s ease;
    }

    .bar-count {
        width: 24px;
        text-align: right;
        font-size: 13px;
        font-weight: 700;
        color: #800020;
        flex-shrink: 0;
    }

    /* Recent users list */

    .recent-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #f0e2e6;
    }

    .recent-item:last-child {
        border-bottom: none;
    }

    .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, #a8324f, #800020);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        flex-shrink: 0;
    }

    .recent-info .name {
        font-weight: 700;
        font-size: 14px;
        color: #2d1a20;
    }

    .recent-info .meta {
        font-size: 12px;
        color: #8a5a66;
    }

    .empty-state {
        text-align: center;
        color: #8a5a66;
        padding: 30px 10px;
        font-size: 14px;
    }

    .loading-text {
        text-align: center;
        color: #800020;
        font-weight: bold;
        padding: 30px;
    }

</style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <div>
            <h1>📊 Dashboard Users</h1>
            <div class="subtitle">Ringkasan data dari database <b>data_api</b></div>
        </div>

        <a class="btn-nav" href="index.html">⇦ Kembali ke Daftar Data</a>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="loading-text" style="grid-column: 1/-1;">⏳ Memuat statistik...</div>
    </div>

    <div class="panels">

        <div class="panel">
            <h2>📍 Sebaran Alamat</h2>
            <div id="barChart">
                <div class="loading-text">Memuat...</div>
            </div>
        </div>

        <div class="panel">
            <h2>🕓 User Terbaru</h2>
            <div id="recentList">
                <div class="loading-text">Memuat...</div>
            </div>
        </div>

    </div>

</div>

<script>

function escapeHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function initials(name) {
    const parts = String(name).trim().split(/\s+/);
    const first = parts[0]?.[0] || "";
    const second = parts[1]?.[0] || "";
    return (first + second).toUpperCase();
}

function extractCity(address) {
    if (!address) return "Tidak diketahui";
    const parts = String(address).split(",");
    return parts[parts.length - 1].trim() || "Tidak diketahui";
}

fetch("data_json.php")
    .then(res => {
        if (!res.ok) throw new Error("HTTP Error " + res.status);
        return res.json();
    })
    .then(data => {

        // ===== STAT CARDS =====

        const total = data.length;

        const cities = data.map(u => extractCity(u.address));
        const uniqueCities = new Set(cities);

        const domains = data.map(u => {
            const email = u.email || "";
            const at = email.indexOf("@");
            return at >= 0 ? email.slice(at + 1) : "-";
        });
        const uniqueDomains = new Set(domains);

        const latestUser = data.length ? data[data.length - 1] : null;

        document.getElementById("statsGrid").innerHTML = `

            <div class="stat-card">
                <span class="icon">👥</span>
                <div class="value">${total}</div>
                <div class="label">Total Users</div>
            </div>

            <div class="stat-card">
                <span class="icon">📍</span>
                <div class="value">${uniqueCities.size}</div>
                <div class="label">Kota / Alamat Unik</div>
            </div>

            <div class="stat-card">
                <span class="icon">✉️</span>
                <div class="value">${uniqueDomains.size}</div>
                <div class="label">Domain Email Unik</div>
            </div>

            <div class="stat-card">
                <span class="icon">🆕</span>
                <div class="value" style="font-size:20px;">
                    ${latestUser ? escapeHtml(latestUser.name) : "-"}
                </div>
                <div class="label">User Terbaru</div>
            </div>

        `;

        // ===== BAR CHART SEBARAN ALAMAT =====

        const counts = {};
        cities.forEach(c => {
            counts[c] = (counts[c] || 0) + 1;
        });

        const sortedCities = Object.entries(counts)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 8);

        const maxCount = sortedCities.length ? sortedCities[0][1] : 1;

        if (sortedCities.length === 0) {
            document.getElementById("barChart").innerHTML =
                `<div class="empty-state">Belum ada data alamat.</div>`;
        } else {
            document.getElementById("barChart").innerHTML = sortedCities.map(([city, count]) => `
                <div class="bar-row">
                    <div class="bar-label" title="${escapeHtml(city)}">${escapeHtml(city)}</div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width:${(count / maxCount) * 100}%"></div>
                    </div>
                    <div class="bar-count">${count}</div>
                </div>
            `).join("");
        }

        // ===== USER TERBARU (5 terakhir) =====

        const recent = [...data].reverse().slice(0, 5);

        if (recent.length === 0) {
            document.getElementById("recentList").innerHTML =
                `<div class="empty-state">Belum ada user.</div>`;
        } else {
            document.getElementById("recentList").innerHTML = recent.map(u => `
                <div class="recent-item">
                    <div class="avatar">${initials(u.name)}</div>
                    <div class="recent-info">
                        <div class="name">${escapeHtml(u.name)}</div>
                        <div class="meta">@${escapeHtml(u.username)} · ${escapeHtml(extractCity(u.address))}</div>
                    </div>
                </div>
            `).join("");
        }

    })
    .catch(error => {
        console.error(error);

        document.getElementById("statsGrid").innerHTML =
            `<div class="empty-state" style="grid-column:1/-1;">❌ Gagal memuat statistik: ${escapeHtml(error.message)}</div>`;

        document.getElementById("barChart").innerHTML =
            `<div class="empty-state">Gagal memuat data.</div>`;

        document.getElementById("recentList").innerHTML =
            `<div class="empty-state">Gagal memuat data.</div>`;
    });

</script>

</body>
</html>
