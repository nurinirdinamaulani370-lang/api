<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Data Users JSON API</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            font-family:
                'Segoe UI',
                Arial,
                Helvetica,
                sans-serif;

            background: linear-gradient(135deg, #fdf3f5 0%, #f3e6ea 100%);

            margin: 0;

            padding: 40px;
        }


        .container {

            max-width: 1200px;

            margin: auto;

            background: white;

            padding: 35px;

            border-radius: 18px;

            border-top: 6px solid transparent;

            border-image: linear-gradient(90deg, #800020, #c04060) 1;

            box-shadow:
                0 10px 35px
                rgba(128, 0, 32, 0.12);
        }


        h1 {

            text-align: center;

            margin-bottom: 8px;

            color: #5c0017;

            letter-spacing: 0.5px;
        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 25px;
        }


        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

            gap: 10px;
        }


        .status {

            padding: 13px 16px;

            background: linear-gradient(90deg, #fbeef1, #f5e6ea);

            border-left:
                5px solid #800020;

            border-radius: 8px;

            margin-bottom: 20px;

            color: #5c0017;

            font-weight: 600;
        }


        button {

            border: none;

            cursor: pointer;

            padding: 10px 16px;

            border-radius: 8px;

            font-weight: bold;

            transition: all 0.2s ease;

            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        button:hover {

            transform: translateY(-1px);

            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }


        .btn-add {

            background: linear-gradient(135deg, #a8324f, #800020);

            color: white;

            font-size: 15px;
        }


        .btn-edit {

            background: linear-gradient(135deg, #c04060, #a83250);

            color: white;
        }


        .btn-delete {

            background: linear-gradient(135deg, #6b0016, #4a0011);

            color: white;
        }


        .btn-cancel {

            background: #9ca3af;

            color: white;
        }


        .table-wrapper {

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;
        }


        th {

            background: linear-gradient(135deg, #a8324f, #800020);

            color: white;

            padding: 14px 13px;

            text-align: left;
        }

        th:first-child {
            border-top-left-radius: 8px;
        }

        th:last-child {
            border-top-right-radius: 8px;
        }


        td {

            padding: 12px;

            border-bottom:
                1px solid #f0e2e6;
        }


        tr:nth-child(even) {

            background: #fdf7f8;
        }


        tr:hover {

            background: #f5e6ea;

            transition: background 0.15s ease;
        }


        .center {

            text-align: center;
        }


        .loading {

            text-align: center;

            color: #800020;

            font-weight: bold;

            padding: 25px;
        }


        .badge {

            background: #fbeef1;

            color: #800020;

            border: 1px solid #eecdd6;

            padding: 5px 12px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: 600;
        }


        .aksi {

            white-space: nowrap;

            text-align: center;
        }


        .aksi button {

            margin: 2px;
        }


        /* MODAL */

        .modal {

            display: none;

            position: fixed;

            z-index: 1000;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            background:
                rgba(0,0,0,0.5);

            justify-content: center;

            align-items: center;
        }


        .modal-content {

            width: 500px;

            max-width: 90%;

            background: white;

            padding: 28px;

            border-radius: 16px;

            border-top: 5px solid #800020;

            box-shadow:
                0 15px 45px
                rgba(128, 0, 32, 0.25);
        }


        .modal-content h2 {

            margin-top: 0;

            text-align: center;

            color: #5c0017;
        }


        .form-group {

            margin-bottom: 15px;
        }


        .form-group label {

            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }


        .form-group input,
        .form-group textarea {

            width: 100%;

            padding: 10px 12px;

            border:
                1.5px solid #e5d5da;

            border-radius: 8px;

            font-size: 14px;

            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {

            outline: none;

            border-color: #800020;

            box-shadow: 0 0 0 3px rgba(128, 0, 32, 0.1);
        }

        .form-group label {

            color: #5c0017;
        }


        .form-group textarea {

            height: 90px;

            resize: vertical;
        }


        .modal-buttons {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 20px;
        }


        .btn-save {

            background: linear-gradient(135deg, #a8324f, #800020);

            color: white;
        }


        .error {

            text-align: center;

            color: red;

            padding: 25px;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Data Users dari JSON API
    </h1>


    <div class="subtitle">

        Data diambil dari database lokal
        <b>data_api</b>

    </div>


    <div class="top-bar">

        <strong>
            Daftar Data Users
        </strong>


        <div style="display:flex; gap:10px;">

            <a
                href="dashboard.html"
                style="text-decoration:none; display:inline-flex; align-items:center; background:#9ca3af; color:white; padding:9px 14px; border-radius:8px; font-weight:bold; font-size:14px;">

                📊 Dashboard

            </a>

            <button
                class="btn-add"
                onclick="tambahData()">

                + Tambah Data

            </button>

        </div>

    </div>


    <div
        class="status"
        id="status">

        ⏳ Sedang mengambil data...

    </div>


    <div class="table-wrapper">


        <table>


            <thead>

                <tr>

                    <th width="70">
                        NO / ID
                    </th>

                    <th>
                        NAMA
                    </th>

                    <th>
                        USERNAME
                    </th>

                    <th>
                        EMAIL
                    </th>

                    <th>
                        ALAMAT
                    </th>

                    <th width="170">
                        AKSI
                    </th>

                </tr>

            </thead>


            <tbody id="hasil">

                <tr>

                    <td
                        colspan="6"
                        class="loading">

                        Memuat data...

                    </td>

                </tr>

            </tbody>


        </table>

    </div>


</div>



<!-- =========================
     MODAL FORM
========================= -->

<div
    class="modal"
    id="modal">


    <div class="modal-content">


        <h2 id="judulModal">
            Tambah Data User
        </h2>


        <input
            type="hidden"
            id="id">


        <div class="form-group">

            <label>
                Nama
            </label>

            <input
                type="text"
                id="name"
                placeholder="Masukkan nama">

        </div>


        <div class="form-group">

            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Masukkan username">

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Masukkan email">

        </div>


        <div class="form-group">

            <label>
                Alamat
            </label>

            <textarea
                id="address"
                placeholder="Masukkan alamat"></textarea>

        </div>


        <div class="modal-buttons">

            <button
                class="btn-cancel"
                onclick="tutupModal()">

                Batal

            </button>


            <button
                class="btn-save"
                onclick="simpanData()">

                Simpan

            </button>

        </div>


    </div>

</div>



<script>


/* =========================
   AMBIL DATA
========================= */

function loadData() {

    fetch("data_json.php")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "HTTP Error " +
                    response.status
                );

            }

            return response.json();

        })

        .then(data => {

            let html = "";


            data.forEach(item => {

                html += `

                    <tr>

                        <td class="center">
                            <b>${item.id}</b>
                        </td>


                        <td>
                            ${item.name}
                        </td>


                        <td>

                            <span class="badge">
                                ${item.username}
                            </span>

                        </td>


                        <td>
                            ${item.email}
                        </td>


                        <td>
                            ${item.address}
                        </td>


                        <td class="aksi">

                            <button
                                class="btn-edit"
                                onclick='editData(${JSON.stringify(item)})'>

                                ✏ Edit

                            </button>


                            <button
                                class="btn-delete"
                                onclick="hapusData(${item.id})">

                                🗑 Hapus

                            </button>

                        </td>

                    </tr>

                `;

            });


            if (data.length === 0) {

                html = `

                    <tr>

                        <td
                            colspan="6"
                            class="loading">

                            Belum ada data.

                        </td>

                    </tr>

                `;

            }


            document.getElementById(
                "hasil"
            ).innerHTML = html;


            document.getElementById(
                "status"
            ).innerHTML =
                "✅ Data berhasil diambil dari JSON API.";

        })


        .catch(error => {

            console.error(error);


            document.getElementById(
                "hasil"
            ).innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="error">

                        ❌ Gagal mengambil data JSON.

                        <br><br>

                        ${error.message}

                    </td>

                </tr>

            `;


            document.getElementById(
                "status"
            ).innerHTML =
                "❌ Terjadi kesalahan saat mengambil data.";

        });

}


/* =========================
   TAMBAH DATA
========================= */

function tambahData() {

    document.getElementById(
        "judulModal"
    ).innerText =
        "Tambah Data User";


    document.getElementById(
        "id"
    ).value = "";


    document.getElementById(
        "name"
    ).value = "";


    document.getElementById(
        "username"
    ).value = "";


    document.getElementById(
        "email"
    ).value = "";


    document.getElementById(
        "address"
    ).value = "";


    document.getElementById(
        "modal"
    ).style.display = "flex";

}


/* =========================
   EDIT DATA
========================= */

function editData(item) {

    document.getElementById(
        "judulModal"
    ).innerText =
        "Edit Data User";


    document.getElementById(
        "id"
    ).value = item.id;


    document.getElementById(
        "name"
    ).value = item.name;


    document.getElementById(
        "username"
    ).value = item.username;


    document.getElementById(
        "email"
    ).value = item.email;


    document.getElementById(
        "address"
    ).value = item.address;


    document.getElementById(
        "modal"
    ).style.display = "flex";

}


/* =========================
   SIMPAN DATA
========================= */

function simpanData() {

    const id =
        document.getElementById("id").value;

    const name =
        document.getElementById("name").value;

    const username =
        document.getElementById("username").value;

    const email =
        document.getElementById("email").value;

    const address =
        document.getElementById("address").value;


    if (
        name === "" ||
        username === "" ||
        email === "" ||
        address === ""
    ) {

        alert(
            "Semua data harus diisi!"
        );

        return;
    }


    const action =
        id === ""
            ? "add"
            : "edit";


    let data = {

        action: action,

        name: name,

        username: username,

        email: email,

        address: address

    };


    if (id !== "") {

        data.id = id;

    }


    fetch(
        "data_json.php",
        {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(data)

        }

    )

    .then(response =>
        response.json()
    )

    .then(result => {

        if (result.success) {

            alert(
                "✅ " +
                result.message
            );


            tutupModal();


            loadData();

        } else {

            alert(
                "❌ " +
                result.message
            );

        }

    })

    .catch(error => {

        console.error(error);

        alert(
            "Terjadi kesalahan."
        );

    });

}


/* =========================
   HAPUS DATA
========================= */

function hapusData(id) {

    const yakin =
        confirm(
            "Apakah kamu yakin ingin menghapus data ID " +
            id +
            "?"
        );


    if (!yakin) {

        return;

    }


    fetch(
        "data_json.php",
        {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({

                action: "delete",

                id: id

            })

        }

    )

    .then(response =>
        response.json()
    )

    .then(result => {

        if (result.success) {

            alert(
                "✅ " +
                result.message
            );


            loadData();

        } else {

            alert(
                "❌ " +
                result.message
            );

        }

    })

    .catch(error => {

        console.error(error);

        alert(
            "Terjadi kesalahan saat menghapus data."
        );

    });

}


/* =========================
   TUTUP MODAL
========================= */

function tutupModal() {

    document.getElementById(
        "modal"
    ).style.display = "none";

}


/* =========================
   JALANKAN SAAT HALAMAN DIBUKA
========================= */

loadData();


</script>


</body>

</html>
